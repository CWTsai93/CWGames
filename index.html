<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CW Games</title>
<meta name="description" content="CW 做的小遊戲收藏，手機打開就能玩，不用安裝。">
<meta name="theme-color" content="#1B2926">
<link rel="icon" href="./fangkuai/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./fangkuai/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@700;900&family=Chakra+Petch:wght@600&display=swap">
<style>
  :root{
    --ground:#1B2926;
    --shell:#31504A;
    --shell-hi:#3E625A;
    --shell-lo:#24403A;
    --brass:#E3A340;
    --brass-deep:#B77E23;
    --ivory:#F3EDE0;
    --muted:#9CB4AC;
    --glow:#7FE3D2;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    --serif:"Noto Serif TC","Songti TC",serif;
    --digit:"Chakra Petch","Noto Sans TC",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ivory);
    font-family:var(--sans);
    -webkit-text-size-adjust:100%;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding-inline:20px;
    padding-block:calc(36px + env(safe-area-inset-top)) calc(40px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:28px;
  }

  header{display:flex;flex-direction:column;gap:10px}
  h1{
    margin:0;
    font-family:var(--serif);
    font-weight:900;
    font-size:clamp(30px,9vw,40px);
    letter-spacing:.06em;
    line-height:1.15;
    text-wrap:balance;
  }
  .kicker{
    font-family:var(--digit);
    font-size:12px;
    letter-spacing:.34em;
    color:var(--brass);
    text-transform:uppercase;
  }
  .lede{margin:0;font-size:15px;line-height:1.85;color:var(--muted);max-width:34em}

  .games{display:flex;flex-direction:column;gap:16px;list-style:none;margin:0;padding:0}
  .game{
    display:grid;
    grid-template-columns:72px 1fr;
    gap:16px;
    align-items:center;
    background:var(--shell-lo);
    border:1px solid var(--shell);
    border-radius:18px;
    padding:16px;
    text-decoration:none;
    color:inherit;
  }
  .game:hover{border-color:var(--shell-hi);background:#27453E}
  .game:active{transform:translateY(1px)}
  .game:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
  .game img{
    width:72px;height:72px;display:block;border-radius:16px;
    box-shadow:0 6px 16px rgba(0,0,0,.35);
  }
  .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
  .name{font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:.05em}
  .desc{font-size:14px;line-height:1.65;color:var(--muted)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .tag{
    font-size:11px;letter-spacing:.12em;color:var(--glow);
    border:1px solid rgba(127,227,210,.3);border-radius:999px;padding:3px 9px;
  }
  .go{
    grid-column:1 / -1;
    margin-top:4px;
    background:linear-gradient(180deg,var(--brass) 0%,var(--brass-deep) 100%);
    color:#22190A;
    font-weight:700;font-size:17px;letter-spacing:.1em;
    border-radius:12px;min-height:52px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }

  .tips{
    border-top:1px solid var(--shell);
    padding-top:22px;
    display:flex;flex-direction:column;gap:12px;
  }
  .tips h2{
    margin:0;font-family:var(--sans);font-weight:700;font-size:14px;
    letter-spacing:.2em;color:var(--muted);
  }
  .tips dl{margin:0;display:flex;flex-direction:column;gap:10px}
  .tips dt{font-weight:700;font-size:14px;color:var(--ivory)}
  .tips dd{margin:2px 0 0;font-size:14px;line-height:1.7;color:var(--muted)}
  footer{font-size:12px;letter-spacing:.1em;color:var(--muted);text-align:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="kicker">CW Games</span>
    <h1>自己做的小遊戲</h1>
    <p class="lede">手機打開就能㎩，不用下載、不用註冊、不用帳號。點進去就開始。</p>
  </header>

  <!-- 要新增遊戲時，複製下面整個 <li class="game-item"> 區塊，改路徑、名稱與說明即可 -->
  <ul class="games">
    <li class="game-item">
      <a class="game" href="./fangkuai/">
        <img src="./fangkuai/icon-192.png" alt="方塊時光圖示" width="72" height="72">
        <div class="meta">
          <span class="name">方塊時光</span>
          <span class="desc">經典俄羅斯方塊。大按鈕操作、速度可選，會記住最高分。</span>
          <span class="tags"><span class="tag">繁體中文</span><span class="tag">大按鈕</span><span class="tag">可離線</span></span>
        </div>
        <span class="go">開始玩 ▸</span>
      </a>
    </li>
  </ul>

  <section class="tips">
    <h2>小提醒</h2>
    <dl>
      <dt>想放到手機桌面？</dt>
      <dd>iPhone 用 Safari 打開，按下方分享鈕選「加入主畫面」；Android 用 Chrome 打開，按右上角三個點選「加到主畫面」。之後點桌面圖示就能全螢幕玩。</dd>
      <dt>沒網路可以玩嗎？</dt>
      <dd>加到主畫面後，方塊時光第一次載入完就存在手機裡，之後沒網路也玩得動。</dd>
    </dl>
  </section>

  <footer>Made by CW · 想玩就直接點，玩壞不了</footer>

</div>
</body>
</html>
